
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>Aetheria Map Browser</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070b14;
  color: #eaf7ff;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 16px;
  background: #0d1423;
  border-bottom: 1px solid #16435b;
  box-shadow: 0 4px 25px #00d9ff12;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  color: #37e5ff;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #849bb3;
}

.search {
  display: flex;
  gap: 8px;
  padding: 14px;
}

input {
  flex: 1;
  width: 100%;
  min-width: 0;
  padding: 13px;
  color: white;
  background: #111c2c;
  border: 1px solid #23455d;
  border-radius: 10px;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #37e5ff;
}

button {
  border: 1px solid #1b617a;
  background: #103347;
  color: #4be7ff;
  border-radius: 10px;
  padding: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #20536b;
}

.tools {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 14px 12px;
}

#status {
  padding: 12px 14px;
  background: #0d1423;
  color: #a4bdd0;
  font-size: 12px;
  border-top: 1px solid #182c40;
}

#map {
  height: 62vh;
  min-height: 350px;
  width: 100%;
  background: #101827;
}

.panel {
  padding: 16px;
  background: #0d1423;
  border-top: 1px solid #18364c;
}

.panel h3 {
  margin: 0 0 8px;
  color: #37e5ff;
}

.panel p {
  color: #9bb1c4;
  font-size: 13px;
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 18px 10px;
  font-size: 11px;
  color: #7891a6;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #101d2c;
  color: #effaff;
}

.leaflet-control-zoom a {
  background: #101d2c !important;
  color: #37e5ff !important;
  border-color: #29475c !important;
}

.leaflet-control-attribution {
  font-size: 9px !important;
}
</style>
</head>

<body>
<header>
  <div class="logo">✦ AETHERIA MAP</div>
  <div class="subtitle">INTERACTIVE MAP BROWSER</div>
</header>

<div class="search">
  <input id="query"
    placeholder="Cari kota atau tempat..."
    aria-label="Cari lokasi">
  <button id="searchBtn">CARI</button>
</div>

<div class="tools">
  <button id="locateBtn">◎ Lokasi Saya</button>
  <button id="pinBtn">＋ Tambah Pin</button>
</div>

<div id="status">Sistem siap. Selamat menjelajah!</div>
<div id="map"></div>

<section class="panel">
  <h3>EXPLORER CONSOLE</h3>
  <p>
    Cari tempat, jelajahi peta, dan tandai lokasi
    pilihanmu dengan fitur pin.
  </p>
  <button id="resetBtn">⌖ Kembali ke Peta Awal</button>
</section>

<footer>
  AETHERIA MAP BROWSER<br>
  Map data © OpenStreetMap contributors
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const statusBox = document.getElementById("status");

function status(message) {
  statusBox.textContent = message;
}

// Tampilan awal: Bandung dan sekitarnya
const map = L.map("map", {
  zoomControl: false
}).setView([-6.9147, 107.6098], 11);

L.control.zoom({
  position: "bottomright"
}).addTo(map);

// Peta gelap
L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    maxZoom: 20,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
  }
).addTo(map);

// Grup untuk semua pin yang dibuat
const pins = L.layerGroup().addTo(map);

async function searchPlace() {
  const query = document.getElementById("query")
    .value.trim();

  if (!query) {
    status("Masukkan nama lokasi terlebih dahulu.");
    return;
  }

  status("Sedang mencari lokasi...");

  try {
    const url =
      "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="
      + encodeURIComponent(query);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Pencarian tidak tersedia");
    }

    const results = await response.json();

    if (results.length === 0) {
      status("Lokasi tidak ditemukan. Coba kata lain.");
      return;
    }

    const place = results[0];
    const lat = Number(place.lat);
    const lon = Number(place.lon);

    map.setView([lat, lon], 15);

    L.marker([lat, lon])
      .addTo(pins)
      .bindPopup(place.display_name)
      .openPopup();

    status("Ditemukan: " + place.display_name);
  } catch (error) {
    status("Pencarian gagal. Periksa koneksi internet.");
  }
}

document.getElementById("searchBtn")
  .addEventListener("click", searchPlace);

document.getElementById("query")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") {
      searchPlace();
    }
  });

// Lokasi perangkat
document.getElementById("locateBtn")
  .addEventListener("click", () => {
    if (!navigator.geolocation) {
      status("Browser tidak mendukung lokasi perangkat.");
      return;
    }

    status("Meminta izin lokasi...");

    navigator.geolocation.getCurrentPosition(
      position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        map.setView([lat, lon], 16);

        L.marker([lat, lon])
          .addTo(pins)
          .bindPopup("Lokasi perangkat kamu")
          .openPopup();

        status("Lokasi berhasil ditemukan.");
      },
      () => {
        status("Lokasi gagal. Periksa izin lokasi browser.");
      },
      {
        enableHighAccuracy: true,
        timeout: 12000
      }
    );
  });

// Tambah pin dengan mengetuk peta
let pinMode = false;

document.getElementById("pinBtn")
  .addEventListener("click", () => {
    pinMode = !pinMode;

    map.getContainer().style.cursor =
      pinMode ? "crosshair" : "";

    status(
      pinMode
        ? "Ketuk lokasi di peta untuk membuat pin."
        : "Mode pin dimatikan."
    );
  });

map.on("click", event => {
  if (!pinMode) return;

  const lat = event.latlng.lat;
  const lon = event.latlng.lng;

  L.marker(event.latlng)
    .addTo(pins)
    .bindPopup(
      "<b>PIN AETHERIA</b><br>" +
      "Latitude: " + lat.toFixed(5) +
      "<br>Longitude: " + lon.toFixed(5)
    )
    .openPopup();

  pinMode = false;
  map.getContainer().style.cursor = "";

  status("Pin berhasil ditambahkan.");
});

// Kembali ke posisi awal
document.getElementById("resetBtn")
  .addEventListener("click", () => {
    map.setView([-6.9147, 107.6098], 11);
    status("Kembali ke peta awal.");
  });
</script>
</body>
</html>
